# BallPicker — isolated LOCAL staging stack for Clubs device QA.
#
# Staging-only: its own MariaDB volume, its own storage volume, a mail sink
# (Mailpit), no cron/monitor that talks to production. No bind mounts: code,
# public/ and nginx config are baked into images built from the dedicated git
# worktree (STAGING_WORKTREE), and the backend environment comes from that
# worktree's backend/.env via env_file (read by the compose CLI on the host).
#
#   staging/dc up -d --build            (staging/dc = this file + staging/.env)
#
# Nothing is published on 0.0.0.0: the LOCAL web server, the Mailpit UI and the
# DB listen on 127.0.0.1 only. Devices reach staging only through the optional
# HTTPS tunnel, which talks to nginx's PUBLIC allowlist server (:8080, not
# published); /admin and Mailpit are never reachable through it.

name: ballpicker-staging

x-app-build: &app-build
  context: ${STAGING_WORKTREE:?set STAGING_WORKTREE in staging/.env}
  dockerfile: ${STAGING_DIR:?set STAGING_DIR in staging/.env}/Dockerfile.app
  additional_contexts:
    staging: ${STAGING_DIR}

services:
  db:
    image: ${STAGING_DB_IMAGE:-mariadb:11.4}   # pin to the production engine/major once verified
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ballpicker_staging
      MARIADB_USER: ballpicker_staging
      MARIADB_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD in staging/.env}
      MARIADB_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD:?set STAGING_DB_ROOT_PASSWORD in staging/.env}
    volumes:
      - staging_db:/var/lib/mysql
    ports:
      - "127.0.0.1:${STAGING_DB_PORT:-33070}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  mailpit:
    # Every email (portal 2FA codes, verification, resets, ops alerts) lands
    # here and nowhere else. UI: http://127.0.0.1:8025 (this Mac only).
    image: ${STAGING_MAILPIT_IMAGE:-axllent/mailpit:v1.24.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_MAILPIT_UI_PORT:-8025}:8025"

  app:
    build: *app-build
    image: ballpicker-staging-app:local
    restart: unless-stopped
    env_file:
      - ${STAGING_WORKTREE}/backend/.env
    volumes:
      - staging_storage:/var/www/backend/storage
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  scheduler:
    # Same image + env as `app`; the Laravel scheduler (competition tick,
    # reconcile, daily jobs) like the production www-data cron.
    image: ballpicker-staging-app:local
    restart: unless-stopped
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "php artisan schedule:work"]
    env_file:
      - ${STAGING_WORKTREE}/backend/.env
    volumes:
      - staging_storage:/var/www/backend/storage
    depends_on:
      app:
        condition: service_started

  web:
    build:
      context: ${STAGING_WORKTREE}
      dockerfile: ${STAGING_DIR}/Dockerfile.web
      additional_contexts:
        staging: ${STAGING_DIR}
    image: ballpicker-staging-web:local
    restart: unless-stopped
    environment:
      STAGING_PORTAL_HTPASSWD: ${STAGING_PORTAL_HTPASSWD:?set STAGING_PORTAL_HTPASSWD in staging/.env}
    volumes:
      - staging_storage:/var/www/backend/storage:ro
    ports:
      # LOCAL server only. The PUBLIC server (:8080) is deliberately not published.
      - "127.0.0.1:${STAGING_WEB_PORT:-8088}:80"
    depends_on:
      - app

  tunnel:
    # OPTIONAL HTTPS entry point for real devices (iOS blocks plain http).
    # Started only with: staging/dc --profile tunnel up -d tunnel
    # Prints a random https://<words>.trycloudflare.com URL in its logs.
    profiles: ["tunnel"]
    image: ${STAGING_TUNNEL_IMAGE:-cloudflare/cloudflared:2025.8.1}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:8080"]
    depends_on:
      - web

networks:
  default:
    # Fixed subnet so TRUSTED_PROXIES can name exactly this network.
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  staging_db:
  staging_storage:
