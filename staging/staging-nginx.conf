# nginx for the local BallPicker staging stack (docs/clubs-staging-plan.md).
#
# Two servers on purpose:
#   :80   LOCAL   — published on 127.0.0.1:8088 only (this Mac). Full app,
#                   incl. the platform admin (/admin). No proxy headers trusted.
#   :8080 PUBLIC  — reachable ONLY through the Cloudflare quick tunnel. Strict
#                   allowlist: mobile API, signed club media, public images,
#                   legal / password-reset pages and the club portal (behind an
#                   extra HTTP basic-auth layer on top of its own password +
#                   emailed 2FA). Everything else — /admin, /up, /sanctum,
#                   /storage uploads, dotfiles — is a 404.
#
# storage/app/private (club photos / club challenge images) is never served by
# nginx on either server; it goes through the signed /media/clubs route.

limit_req_zone $binary_remote_addr zone=bp_public:10m rate=15r/s;

map $http_cf_connecting_ip $bp_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# ---------------------------------------------------------------- LOCAL
server {
    listen 80 default_server;
    server_name _;
    root /var/www/backend/public;
    index index.php;
    client_max_body_size 25m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /storage/ {
        limit_except GET HEAD { deny all; }
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        # Direct local access: never honour client-supplied proxy headers.
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}

# ---------------------------------------------------------------- PUBLIC (tunnel)
server {
    listen 8080;
    server_name _;
    root /var/www/backend/public;
    client_max_body_size 25m;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_req zone=bp_public burst=60 nodelay;
    limit_req_status 429;

    # Everything not allow-listed below.
    location / { return 404; }

    # Mobile app API.
    location ^~ /api/ {
        include /etc/nginx/snippets/bp-public-php.conf;
    }

    # Signed private club media (signature checked in PHP).
    location ^~ /media/clubs/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/bp-public-php.conf;
    }

    # Public-disk images only (challenge images, pack covers, logos, avatars).
    location ^~ /storage/ {
        limit_except GET HEAD { deny all; }
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
    }

    # Pages the app links to.
    location ~ ^/(privacy|terms|support|forgot-password|reset-password)$ {
        include /etc/nginx/snippets/bp-public-php.conf;
    }

    # Club portal for phone-browser QA: extra basic-auth gate (testers only),
    # then the portal's own password + mandatory emailed code (Mailpit, local).
    location ~ ^/club(/|$) {
        auth_basic "BallPicker staging";
        auth_basic_user_file /etc/nginx/staging.htpasswd;
        include /etc/nginx/snippets/bp-public-php.conf;
    }

    # Static assets that exist in public/ (favicon, images, css/js).
    location ~* \.(?:ico|png|jpe?g|svg|webp|css|js|woff2?)$ {
        try_files $uri =404;
    }
}
