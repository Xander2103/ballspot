# PHP handoff for the PUBLIC (tunnel) nginx server. The request always arrived
# over HTTPS at Cloudflare, so the forwarded scheme/port are fixed here instead
# of trusting whatever the client sent; the client IP comes from Cloudflare.
fastcgi_pass app:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param HTTP_X_FORWARDED_PROTO https;
fastcgi_param HTTP_X_FORWARDED_PORT 443;
fastcgi_param HTTP_X_FORWARDED_HOST $host;
fastcgi_param HTTP_X_FORWARDED_FOR $bp_client_ip;
fastcgi_read_timeout 60s;
