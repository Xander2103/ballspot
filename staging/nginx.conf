# nginx for the local BallPicker staging stack. Mirrors the production layout:
# Laravel public/ as web root, /storage/ served from the public disk only.
# storage/app/private (club photos and club challenge images) is NEVER served
# by nginx; it goes through the signed /media/clubs route in PHP.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/backend/public;
    index index.php;

    client_max_body_size 25m;

    add_header X-Robots-Tag "noindex, nofollow" always;   # staging must never be indexed

    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
