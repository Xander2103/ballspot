# BallPicker — uploaded images under /storage/ (image performance pass 2026-11-06)
#
# Paste INSIDE the existing `server { listen 443 ... }` block of the BallPicker
# site, ABOVE `location / { ... }`. Then: sudo nginx -t && sudo systemctl reload nginx
#
# Why this is safe to cache for a year ("immutable"):
#   every file under storage/app/public gets a random, unique name per upload
#   (Laravel store() / Str::random(40)) and is never rewritten in place; a
#   replaced challenge photo, cover or avatar always gets a NEW name, and the
#   display copies are named after their source + a version suffix. So a
#   cached URL can never point at different bytes.
#
# What it changes versus today (measured 2026-11-06 on production):
#   - today /storage/* files go through `location /` with no Cache-Control and
#     no Expires: every client revalidates or re-downloads by heuristic;
#   - a missing /storage/ file today boots PHP/Laravel to render a 404; here
#     nginx answers 404 itself;
#   - uploads are never executed or routed to PHP from this prefix.
#
# IMPORTANT: an add_header inside a location REPLACES all server-level
# add_header lines for these responses. Repeat here every security header your
# server block sets (prod currently sends X-Content-Type-Options: nosniff).

location ^~ /storage/ {
    limit_except GET HEAD { deny all; }
    try_files $uri =404;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log off;
    sendfile on;
    tcp_nopush on;
    open_file_cache max=2000 inactive=120s;
    open_file_cache_valid 300s;
}

# Optional, separate change (also measurable, not required for the above):
# enable HTTP/2 on the TLS listener so the app's parallel requests (API +
# images + covers) share one connection. On nginx 1.24 (Ubuntu 24.04):
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
